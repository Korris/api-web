syntax = "proto3";

import "google/protobuf/wrappers.proto";

option csharp_namespace = "Mcsg.Analytic.Application.Protos";

package comic;

service ComicProto {
    rpc Create (ComicCreateReq) returns (ComicCreateRsp);
    rpc Update (ComicUpdateReq) returns (ComicUpdateRsp);
    rpc Delete (ComicDeleteReq) returns (ComicDeleteRsp);
}

message ComicCreateReq {
    repeated ComicProtoDto items = 1;
}

message ComicUpdateReq {
    string postId = 1;
    string title = 2;
    google.protobuf.StringValue modifiedOn = 3;
    google.protobuf.StringValue modifiedBy = 4;
}

message ComicDeleteReq {
    string postId = 1;
}

message ComicCreateRsp {
    bool success = 1;
    string message = 2;
    repeated ComicOutputDto items = 3;
}

message ComicUpdateRsp {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message ComicDeleteRsp {
    bool success = 1;
    string message = 2;
    int64 id = 3;
}

message ComicProtoDto {
    string postId = 1;
    string hashId = 2;
    string userId = 3;
    string title = 4;
    string createdOn = 5;
    google.protobuf.StringValue createdBy = 6;
    google.protobuf.StringValue modifiedOn = 7;
    google.protobuf.StringValue modifiedBy = 8;
}

message ComicOutputDto {
    int64 id = 1;
}
