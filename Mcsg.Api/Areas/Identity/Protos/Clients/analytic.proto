syntax = "proto3";

option csharp_namespace = "Mcsg.Analytic.Application.Protos";

package analytic;

service AnalyticProto {
    rpc Delete (AnalyticDeleteReq) returns (AnalyticDeleteRsp);
}

message AnalyticDeleteReq {
    string userId = 1;
    int32 status = 2;
}

message AnalyticDeleteRsp {
    bool success = 1;
    string message = 2;
}
