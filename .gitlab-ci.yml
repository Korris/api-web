########################################
# Focfoc Multi-Service Build & Deploy CI
########################################

workflow:
  rules:
    - when: always

variables:
  DEPLOY_ENV:
    value: "dev"
    options: ["dev", "staging", "prod"]
    description: "Select the environment to deploy"

  FORCE_ALL:
    value: "false"
    description: "Set true to force build/push all services regardless of diff"

  # List of all microservices (each has its own Dockerfile)
  SERVICES: "Mcsg.Api Mcsg.Function.Job Mcsg.Media.Tool"

  # Telegram deploy notification (placeholders – replace with real values,
  # or override via Settings → CI/CD → Variables which takes precedence over this file)
  TELEGRAM_BOT_TOKEN: "8848286070:AAExs-LkRb0QjjgtREBVjcS8i_zw1yXkqbk"
  TELEGRAM_CHAT_ID: "-5408358582"

stages:
  - detect
  - build
  - push
  - deploy
  - notify

image: docker:29-cli

before_script:
  - apk add --no-cache git
  - echo "Logging in to Azure Container Registry..."
  - echo "$AZURE_ACR_PASSWORD" | docker login "$AZURE_ACR_LOGIN_SERVER" -u "$AZURE_ACR_USERNAME" --password-stdin

# ---------- DETECT CHANGES ----------
detect_changes:
  stage: detect
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - |
      echo "🔍 Detecting changed services..."

      if [ "$FORCE_ALL" = "true" ]; then
        echo "FORCE_ALL=true → building all services"
        echo "$SERVICES" > changed_services.txt
      else
        if [ -z "$CI_COMMIT_BEFORE_SHA" ]; then
          echo "No previous commit found; rebuilding all services."
          echo "$SERVICES" > changed_services.txt
        else
          apk add --no-cache git > /dev/null
          git fetch origin "$CI_COMMIT_BEFORE_SHA" || true
          git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" > diff.txt || true
          cat diff.txt

          CHANGED=""
          if grep -q "^Common/" diff.txt; then
            echo "Common changed → rebuild all services"
            CHANGED="$SERVICES"
          else
            for dir in $SERVICES; do
              if grep -q "^$dir/" diff.txt; then
                echo "Detected changes in $dir"
                CHANGED="$CHANGED $dir"
              fi
            done
          fi

          if [ -z "$CHANGED" ]; then
            echo "🚫 No services changed. Skipping all builds."
            echo "" > changed_services.txt
            touch no_changes.flag          # 🟢 create marker file
          else
            echo "$CHANGED" > changed_services.txt
          fi
        fi
      fi
    - cat changed_services.txt
  artifacts:
    paths:
      - changed_services.txt
      - no_changes.flag
    expire_in: 1 hour


# ---------- BUILD ----------
.build_template: &build_template
  stage: build
  script:
    - echo "🔨 Building Docker images..."
    - |
      IMAGE_TAG="${ENV}-${CI_COMMIT_SHORT_SHA}"
      echo "Using IMAGE_TAG=$IMAGE_TAG"

      CHANGED=$(cat changed_services.txt)
      if [ -z "$CHANGED" ]; then
        echo "🚫 No changed services to build."
        exit 0
      fi

      for dir in $CHANGED; do
        IMAGE_NAME=$(echo "$dir" | tr '[:upper:]' '[:lower:]' | sed 's/^mcsg/focfoc/' | tr '.' '-')
        echo "➡️ Building $IMAGE_NAME..."
        docker build \
          --build-arg ENV=$ENV \
          -f $dir/Dockerfile \
          -t $AZURE_ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG . || exit 1
      done
  needs: ["detect_changes"]
  artifacts:
    paths:
      - changed_services.txt


# ---------- PUSH ----------
.push_template: &push_template
  stage: push
  script:
    - echo "📦 Pushing Docker images..."
    - |
      IMAGE_TAG="${ENV}-${CI_COMMIT_SHORT_SHA}"
      CHANGED=$(cat changed_services.txt)

      if [ -z "$CHANGED" ]; then
        echo "🚫 No changed services to push."
        exit 0
      fi

      for dir in $CHANGED; do
        IMAGE_NAME=$(echo "$dir" | tr '[:upper:]' '[:lower:]' | sed 's/^mcsg/focfoc/' | tr '.' '-')
        echo "➡️ Pushing $IMAGE_NAME..."
        docker push $AZURE_ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG || exit 1
        docker rmi $AZURE_ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG || true
      done

      docker system prune -f || true
  needs: ["detect_changes"]
  artifacts:
    paths:
      - changed_services.txt
    expire_in: 1 hour


# ---------- DEPLOY BASES ----------
.deploy_base_aks: &deploy_base_aks
  image: binhhieu001/k8saz:latest
  before_script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az aks get-credentials --resource-group rg-grid-$ENV-aks --name grid-$ENV-aks --overwrite-existing
    - kubelogin convert-kubeconfig -l azurecli

.deploy_base_local: &deploy_base_local
  image: binhhieu001/k8saz:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - if [ -n "$KUBE_CONTEXT" ]; then kubectl config use-context "$KUBE_CONTEXT" || true; fi
    - kubectl version --client
    - helm version


# ---------- DEPLOY SERVICE TEMPLATE ----------
.deploy_service_template: &deploy_service_template
  stage: deploy
  script:
    - |
      echo "🚀 Deploying $SERVICE_NAME in ${ENV:-unset}..."
      
      # 🛡️ Ensure ENV is correctly set
      if [ -z "$ENV" ]; then
        case "$CI_COMMIT_BRANCH" in
          dev) ENV="dev" ;;
          release) ENV="staging" ;;
          main) ENV="prod" ;;
          *) echo "❌ Cannot determine ENV for branch: $CI_COMMIT_BRANCH"; exit 1 ;;
        esac
        echo "⚙️ ENV auto-detected as $ENV"
      fi
      export ENV
    - export IMAGE_TAG="${ENV}-${CI_COMMIT_SHORT_SHA}"
    - export SERVICE_KEY=$(echo $SERVICE_NAME | tr '[:upper:]' '[:lower:]' | sed 's/^mcsg/focfoc/' | tr '.' '-')
    - echo "🔧 Service key → $SERVICE_KEY"
    - echo "🔧 Image tag → $IMAGE_TAG"
    - git clone --depth=1 https://${REPOSITORY_USERNAME}:${REPOSITORY_PASSWORD}@repo.ntada.vn/devops/ntada-azure-infra.git
    - cd ntada-azure-infra/helm_local
    - |
      if [ ! -f "values-$ENV.yaml" ]; then
        echo "❌ Missing values-$ENV.yaml for environment: $ENV"
        exit 1
      fi

      CHANGED=$(cat ../../changed_services.txt 2>/dev/null || echo "$SERVICE_NAME")
      if ! echo "$CHANGED" | grep -q "$SERVICE_NAME"; then
        echo "⚙️ No changes detected for $SERVICE_NAME → skipping deploy."
        exit 0
      fi

      echo "✅ Deploying service $SERVICE_KEY..."
      helm template -f values-$ENV.yaml \
        --set namespace=focfoc-$ENV \
        --set ${SERVICE_KEY}.enabled=true \
        --set ${SERVICE_KEY}.imageTag=$IMAGE_TAG \
        --set ${SERVICE_KEY}.env=$ENV . \
      | kubectl apply -f -

    - kubectl rollout status deployment/${SERVICE_KEY} -n focfoc-$ENV
  resource_group: deploy-$ENV   # Prevent concurrent deploys per environment


# ---------- TELEGRAM NOTIFY TEMPLATE ----------
# Uses TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID from the top-level variables block
# (or CI/CD project variables, which override the file):
#   TELEGRAM_BOT_TOKEN  – token from @BotFather
#   TELEGRAM_CHAT_ID    – channel id (e.g. -1001234567890) or @channelusername; bot must be channel admin
.notify_telegram_template: &notify_telegram_template
  stage: notify
  image: curlimages/curl:latest
  before_script: []
  script:
    - |
      if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
        echo "⚠️ TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set → skipping notification."
        exit 0
      fi

      CHANGED=$(cat changed_services.txt 2>/dev/null | xargs)
      if [ -z "$CHANGED" ] && [ "$DEPLOY_STATUS" = "success" ]; then
        echo "🚫 No services deployed → skipping notification."
        exit 0
      fi
      [ -z "$CHANGED" ] && CHANGED="(unknown)"

      if [ "$DEPLOY_STATUS" = "success" ]; then
        ICON="✅"; TITLE="Deploy SUCCESS"
      else
        ICON="❌"; TITLE="Deploy FAILED"
      fi

      # Escape HTML special chars for Telegram parse_mode=HTML
      esc() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
      COMMIT_TITLE=$(esc "$CI_COMMIT_TITLE")
      AUTHOR=$(esc "$GITLAB_USER_NAME")

      ENV_UPPER=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')
      TEXT=$(printf '%s <b>%s</b> · <b>%s</b>\n<b>Project:</b> %s\n<b>Branch:</b> %s\n<b>Services:</b> %s\n<b>Commit:</b> <code>%s</code> %s\n<b>By:</b> %s\n<a href="%s">Pipeline #%s</a>' \
        "$ICON" "$TITLE" "$ENV_UPPER" "$CI_PROJECT_NAME" "$CI_COMMIT_BRANCH" "$CHANGED" \
        "$CI_COMMIT_SHORT_SHA" "$COMMIT_TITLE" "$AUTHOR" "$CI_PIPELINE_URL" "$CI_PIPELINE_ID")

      echo "📨 Sending Telegram notification ($DEPLOY_STATUS)..."
      curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "parse_mode=HTML" \
        --data-urlencode "disable_web_page_preview=true" \
        --data-urlencode "text=${TEXT}"


########################################
#                DEV
########################################
build_dev:
  <<: *build_template
  variables:
    ENV: dev
  needs: ["detect_changes"]
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "dev"'

push_dev:
  <<: *push_template
  variables:
    ENV: dev
  needs: ["build_dev", "detect_changes"]
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "dev"'

.deploy_dev_common: &deploy_dev_common
  <<: *deploy_service_template
  <<: *deploy_base_local
  variables:
    ENV: dev
  needs: ["push_dev"]
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy_dev_api:
  <<: *deploy_dev_common
  variables: { SERVICE_NAME: Mcsg.Api }

deploy_dev_function:
  <<: *deploy_dev_common
  variables: { SERVICE_NAME: Mcsg.Function.Job }

deploy_dev_media:
  <<: *deploy_dev_common
  variables: { SERVICE_NAME: Mcsg.Media.Tool }

notify_dev_success:
  <<: *notify_telegram_template
  variables: { ENV: dev, DEPLOY_STATUS: success }
  needs: ["detect_changes", "deploy_dev_api", "deploy_dev_function", "deploy_dev_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success

notify_dev_failure:
  <<: *notify_telegram_template
  variables: { ENV: dev, DEPLOY_STATUS: failure }
  needs: ["detect_changes", "build_dev", "push_dev", "deploy_dev_api", "deploy_dev_function", "deploy_dev_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_failure


########################################
#               STAGING
########################################
build_staging:
  <<: *build_template
  variables:
    ENV: staging
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "release"'

push_staging:
  <<: *push_template
  variables:
    ENV: staging
  needs: ["build_staging", "detect_changes"]
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "release"'

.deploy_staging_common: &deploy_staging_common
  <<: *deploy_service_template
  <<: *deploy_base_local
  variables:
    ENV: staging
  needs: ["push_staging"]
  rules:
    - exists:
        - no_changes.flag
      when: never   # 🟡 skip build if no_changes.flag exists
    - if: '$CI_COMMIT_BRANCH == "release"'

deploy_staging_api:
  <<: *deploy_staging_common
  variables: { SERVICE_NAME: Mcsg.Api }

deploy_staging_function:
  <<: *deploy_staging_common
  variables: { SERVICE_NAME: Mcsg.Function.Job }

deploy_staging_media:
  <<: *deploy_staging_common
  variables: { SERVICE_NAME: Mcsg.Media.Tool }

notify_staging_success:
  <<: *notify_telegram_template
  variables: { ENV: staging, DEPLOY_STATUS: success }
  needs: ["detect_changes", "deploy_staging_api", "deploy_staging_function", "deploy_staging_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success

notify_staging_failure:
  <<: *notify_telegram_template
  variables: { ENV: staging, DEPLOY_STATUS: failure }
  needs: ["detect_changes", "build_staging", "push_staging", "deploy_staging_api", "deploy_staging_function", "deploy_staging_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_failure


########################################
#              PRODUCTION
########################################
build_production:
  <<: *build_template
  variables:
    ENV: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

push_production:
  <<: *push_template
  variables:
    ENV: prod
  needs: ["build_production", "detect_changes"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.deploy_prod_common: &deploy_prod_common
  <<: *deploy_service_template
  <<: *deploy_base_aks
  variables:
    ENV: prod
  needs: ["push_production"]
  tags: [runner-dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy_prod_api:
  <<: *deploy_prod_common
  variables: { SERVICE_NAME: Mcsg.Api }

deploy_prod_function:
  <<: *deploy_prod_common
  variables: { SERVICE_NAME: Mcsg.Function.Job }

deploy_prod_media:
  <<: *deploy_prod_common
  variables: { SERVICE_NAME: Mcsg.Media.Tool }

# Prod deploy jobs are manual → notify runs after all three have been triggered and finished
notify_prod_success:
  <<: *notify_telegram_template
  variables: { ENV: prod, DEPLOY_STATUS: success }
  needs: ["detect_changes", "deploy_prod_api", "deploy_prod_function", "deploy_prod_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

notify_prod_failure:
  <<: *notify_telegram_template
  variables: { ENV: prod, DEPLOY_STATUS: failure }
  needs: ["detect_changes", "build_production", "push_production", "deploy_prod_api", "deploy_prod_function", "deploy_prod_media"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_failure