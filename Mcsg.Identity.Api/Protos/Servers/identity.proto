syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Mcsg.Identity.Api.Protos";

package identity;

service UserProto {
    rpc Update (UserUpdateReq) returns (UserUpdateRsp);
    rpc Search (UserSearchReq) returns (UserSearchRsp);
    rpc Reset (UserPremiumResetReq) returns (UserPremiumResetRsp);
}

message UserUpdateReq {
    string userUid = 1;
    google.protobuf.Timestamp premiumDate = 2;
}

message UserUpdateRsp {
    bool success = 1;
    string message = 2;
    string id = 3;
    string data = 4;
}

message UserSearchReq {
    string userUid = 1;
}

message UserSearchRsp {
    bool success = 1;
    string message = 2;
    string id = 3;
    string data = 4;
    repeated UserProtoDto items = 5;
}

message UserPremiumResetReq {
    repeated string userIds = 1;
}

message UserPremiumResetRsp {
    bool success = 1;
    string message = 2;
    string id = 3;
}

message UserProtoDto {
    string userId = 1;
    string userName = 2;
    string profileName = 3;
    string userAvatar = 4;
    string email = 5;
    string phoneNumber = 6;
}
